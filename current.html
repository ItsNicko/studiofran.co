* {
  outline: none;
  box-sizing: border-box;
}

:root {
  --theme-bg-color: rgba(16 18 27 / 40%);
  --border-color: rgba(113 119 144 / 25%);
  --theme-color: #f9fafb;
  --inactive-color: rgba(222, 222, 222, 0.78);
  --body-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --hover-menu-bg: rgba(12 15 25 / 30%);
  --content-title-color: #999ba5;
  --content-bg: rgb(146 151 179 / 13%);
  --overlay-bg: rgba(36, 39, 59, 0.3);
  --scrollbar-bg: rgb(1 2 3 / 40%);
}

html {
  box-sizing: border-box;
  -webkit-font-smoothing: antialiased;
}

[data-title]:hover:after {
  opacity: 1;
  transition: all 0.1s ease 0.5s;
  visibility: visible;
}

[data-title]:after {
  content: attr(data-title);
  position: absolute;
  bottom: -1.6em;
  padding: 4px 4px 4px 8px;
  color: #ffffff;
  margin-left: -20vh;
  white-space: nowrap;
  -moz-border-radius: 5px;
  -webkit-border-radius: 5px;
  border-radius: 5px;
  background-color: rgb(201 203 216 / 14%);
  opacity: 0;
  z-index: 99999;
  visibility: hidden;
}

[data-title] {
  position: relative;
}

body {
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Text",
    "SF Pro Display",
    "Segoe UI",
    Roboto,
    sans-serif;
  background-image: url("/Assets/static.webp");
  background-size: cover;
  background-position: center;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 2em;
  width: 100%;
  min-height: 100%;
  margin: 0;
}

@media screen and (max-width: 480px) {
  body {
    padding: 0.8em;
  }
}

.video-bg {
  position: fixed;
  right: 0;
  top: 0;
  width: 100%;
  height: 100%;
}

.video-bg video {
  width: 100%;
  height: 100%;
  -o-object-fit: cover;
  object-fit: cover;
}

img {
  max-width: 100%;
}

.personal-header {
  text-align: center;
  color: rgb(255, 255, 255);
}

.personal-header a {
  text-align: center;
  color: rgb(255, 203, 203);
}

main {
  color: white;
  padding: 0;
}

.app {
  position: relative;
  width: 100%;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  box-shadow:
    0 8px 32px rgba(0, 0, 0, 0.3),
    0 2px 8px rgba(0, 0, 0, 0.2);
  border-radius: 14px;
  overflow: hidden;
  transition: min-height 0.45s cubic-bezier(0.4, 0, 0.25, 1);
}

.app:has(.window-minimize-checkbox:checked) {
  min-height: 0;
}

.window-chrome {
  display: flex;
  align-items: center;
  height: 38px;
  padding: 0 16px;
  background: rgba(28, 28, 30, 0.55);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  flex-shrink: 0;
  user-select: none;
  -webkit-user-select: none;
}

.window-content {
  flex: 1;
  background: rgba(28, 28, 30, 0.5);
  backdrop-filter: blur(12px) saturate(150%);
  -webkit-backdrop-filter: blur(12px) saturate(150%);
  overflow-y: auto;
  max-height: 3000px;
  padding: 2rem;
  transition:
    max-height 0.45s cubic-bezier(0.4, 0, 0.25, 1),
    padding 0.45s cubic-bezier(0.4, 0, 0.25, 1),
    opacity 0.25s ease;
}

.chrome-nav {
  display: flex;
  align-items: center;
  gap: 2px;
  flex-shrink: 0;
}

.chrome-nav a {
  padding: 6px 10px;
  text-decoration: none;
  color: rgba(255, 255, 255, 0.6);
  border-radius: 6px;
  font-size: 0.8rem;
  transition:
    background 0.15s ease,
    color 0.15s ease;
}

.chrome-nav a:hover,
.chrome-nav a.is-active {
  background: rgba(255, 255, 255, 0.1);
  color: #fff;
}

.traffic-lights {
  display: flex;
  gap: 8px;
  margin-right: 12px;
}

.dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  cursor: pointer;
  transition: transform 0.15s ease;
}

.dot.close {
  background: #ff5f57;
}
.dot.minimize {
  background: #ffbd2e;
}
.dot.maximize {
  background: #28c840;
}

.dot:hover {
  transform: scale(1.15);
}

.dot.close:hover {
  background: #ff3b30;
}
.dot.minimize:hover {
  background: #f5a623;
}
.dot.maximize:hover {
  background: #1db954;
}

.window-title {
  flex: 1;
  text-align: center;
  font-size: 0.85rem;
  font-weight: 400;
  color: rgba(255, 255, 255, 0.7);
  letter-spacing: 0.02em;
}

.chrome-spacer {
  flex: 1;
}

.chrome-utils {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-left: auto;
}

.icon-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  color: rgba(255, 255, 255, 0.7);
  transition:
    background 0.15s ease,
    color 0.15s ease;
  text-decoration: none;
}

.icon-btn:hover {
  background: rgba(255, 255, 255, 0.12);
  color: #fff;
}

.chrome-utils .profile-img {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid rgba(255, 255, 255, 0.25);
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.1);
  margin-left: 4px;
  transition:
    transform 0.2s cubic-bezier(0.25, 1, 0.5, 1),
    box-shadow 0.2s cubic-bezier(0.25, 1, 0.5, 1);
}

.chrome-utils .profile-img:hover {
  transform: scale(1.1);
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.2),
    0 0 8px rgba(255, 255, 255, 0.15);
}

footer {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  color: white;
  font-weight: 400;
}

@media screen and (max-width: 480px) {
  main {
    padding: 1rem;
  }

  .chrome-utils {
    display: none;
  }
}

a {
  text-decoration: none;
  color: rgb(255, 255, 255);
}

.link {
  color: #fff;
  text-decoration: none;
  display: inline-block;
  padding: 15px 0;
  position: relative;
}
.link:after {
  background: none repeat scroll 0 0 transparent;
  bottom: 0;
  content: "";
  display: block;
  height: 2px;
  left: 0;
  position: absolute;
  background: #fff;
  transition: transform 0.3s ease;
  transform: scaleX(0);
  transform-origin: center;
  width: 100%;
}
.link:hover:after {
  transform: scaleX(1);
}

.main-header .header-menu a {
  padding: 20px 24px;
}

::-webkit-scrollbar {

    background: var(--scrollbar-bg);
    border-radius: 10px;

}

h1 {

}

h2 {

h3 {

}

h4 {

}

h5 {
  font-size: 1.125rem;

}

h6 {
  font-size: 1rem;
  font-weight: 600;
  line-height: 1.4;
}

p {
  font-size: 1.0625rem;

  line-height: 1.6;
  letter-spacing: -0.005em;
}

@media (max-width: 480px) {
  html {
    font-size: 12px;
  }
  main {
    padding: 1rem;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

@media (prefers-reduced-transparency: reduce) {
  .window-chrome {
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    background: rgba(28, 28, 30, 0.95);
  }
  .window-content {
    background: rgba(28, 28, 30, 0.98);
  }
}

.window-minimize-checkbox {
  display: none;
}

.window-minimize-checkbox:checked ~ .window-content {
  max-height: 0;
  padding: 0 2rem;
  opacity: 0;
  overflow: hidden;
}

.window-minimize-checkbox:checked ~ .window-chrome .window-title::after {
  content: " — Minimized";
}
