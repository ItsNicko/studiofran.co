        <a href="/blog.html">Posts</a>

      </nav>
      <div class="chrome-utils">
        <a href="/connect.html" class="icon-btn" aria-label="Notifications">
          <svg viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">

            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>

            <line x1="16" y1="17" x2="8" y2="17"/>
            <polyline points="10 9 9 9 8 9"/>

        <a href="/about.html" class="icon-btn" aria-label="Profile">
          <img class="profile-img" src="/Assets/Profile.webp" alt="Nickolas Franco" />
        </a>
      </div>
    </div>
    <div class="window-content">
      <footer>
        <p>© 2025 Nicko | Built with raw HTML + CSS.</p>
      </footer>
    </div>
